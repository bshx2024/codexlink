[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s -nolisten tcp -ac
autorestart=true
priority=10
stdout_logfile=/app/logs/xvfb.log
stderr_logfile=/app/logs/xvfb.err

[program:fluxbox]
command=fluxbox -display :99
autorestart=true
priority=20
stdout_logfile=/app/logs/fluxbox.log
stderr_logfile=/app/logs/fluxbox.err

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -rfbport %(ENV_VNC_PORT)s -nopw
autorestart=true
priority=30
stdout_logfile=/app/logs/x11vnc.log
stderr_logfile=/app/logs/x11vnc.err

[program:novnc]
command=websockify --web /usr/share/novnc %(ENV_NOVNC_PORT)s localhost:%(ENV_VNC_PORT)s
autorestart=true
priority=40
stdout_logfile=/app/logs/novnc.log
stderr_logfile=/app/logs/novnc.err

[program:bridge_server]
command=node /app/server/index.js
directory=/app/server
autorestart=true
priority=50
stdout_logfile=/app/logs/bridge_server.log
stderr_logfile=/app/logs/bridge_server.err

[program:chromium]
command=/bin/bash -c "sleep 3 && /usr/bin/chromium --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer --window-size=1420,1080 --window-position=0,0 --load-extension=/app/extension --disable-blink-features=AutomationControlled http://127.0.0.1:3010/health"
environment=DISPLAY=":99"
autorestart=true
priority=60
stdout_logfile=/app/logs/chromium.log
stderr_logfile=/app/logs/chromium.err

[program:sidepanel]
command=/bin/bash -c "sleep 6 && /usr/bin/chromium --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer --window-size=500,1080 --window-position=1420,0 --app=chrome-extension://edoicfpldmlabgdalemfgflpldiijdmm/sidepanel.html"
environment=DISPLAY=":99"
autorestart=true
priority=65
stdout_logfile=/app/logs/sidepanel.log
stderr_logfile=/app/logs/sidepanel.err

[program:cloud_daemon]
command=/bin/bash -c "sleep 10 && node /app/docker/cloud_daemon.js"
directory=/app
autorestart=true
priority=70
stdout_logfile=/app/logs/cloud_daemon.log
stderr_logfile=/app/logs/cloud_daemon.err
